sonar.projectKey=ccvv
sonar.projectName=ccvv
sonar.projectVersion=1.2.0

# Sources and tests
sonar.sources=core/ccvv-lib/src,core/ccvv-cli/src,core/ccvv-linux/src,core/ccvv-linux/build.rs,mac,linux,.github,scripts
sonar.tests=core/ccvv-lib/tests,core/ccvv-cli/tests,core/ccvv-linux/tests
sonar.test.inclusions=**/*test*/**,**/*tests*/**
sonar.exclusions=**/target/**,**/build/**,**/.git/**,**/fixtures/**,**/.agents/**,**/.sonarqube/**,docs/**,specs/**

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Coverage (cargo-llvm-cov LCOV output)
sonar.rust.lcov.reportPaths=core/target/coverage/lcov.info

# Clippy report (cargo clippy JSON output)
sonar.rust.clippy.enable=false
sonar.rust.cargo.manifestPaths=core/ccvv-lib/Cargo.toml,core/ccvv-cli/Cargo.toml,core/ccvv-linux/Cargo.toml
sonar.rust.clippy.reportPaths=core/target/clippy-report.json

# Connection
sonar.host.url=http://localhost:9000
