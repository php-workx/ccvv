[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "Unlicense"]

[[licenses.clarify]]
name = "ccvv-lib"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "ccvv-cli"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
# No network-capable crates allowed in the dependency tree
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "surf" },
    { name = "ureq" },
    { name = "attohttpc" },
    { name = "curl" },
    # SECURITY: fancy-regex supports backreferences and lookahead, which are
    # vulnerable to ReDoS. The `regex` crate's linear-time guarantee is a
    # security property that prevents user-defined rules from causing DoS.
    # Do NOT replace `regex` with `fancy-regex` anywhere in the codebase.
    { name = "fancy-regex" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
