[package]
name = "ccvv-linux"
version = "1.5.0"
edition = "2021"
license = "MIT"
rust-version.workspace = true
default-run = "ccvv-linux"

[features]
default = ["x11", "wayland", "tray"]
x11 = ["dep:x11rb"]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:wl-clipboard-rs"]
tray = ["dep:ksni"]
xembed = []
# Note: HTML rich-text extraction (clipboard/html.rs) is always compiled. The
# earlier `html-extract` feature flag was a no-op gate and was removed to
# avoid suggesting a build-time toggle that did not actually exist.

[[bin]]
name = "ccvv-linux"
path = "src/main.rs"

[[bin]]
name = "ccvv-tray-sni"
path = "src/bin/ccvv-tray-sni.rs"
required-features = ["tray"]

[[bin]]
name = "ccvv-indicator-legacy"
path = "src/bin/ccvv-indicator-legacy.rs"
required-features = ["xembed"]

[dependencies]
ccvv-lib = { path = "../ccvv-lib" }
clap.workspace = true
ksni = { version = "0.3.3", default-features = false, features = ["blocking", "async-io"], optional = true }
signal-hook = "0.3"
sha2.workspace = true
thiserror.workspace = true
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"], optional = true }
wl-clipboard-rs = { version = "0.9.0", optional = true }
