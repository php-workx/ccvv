[package]
name = "ccvv-cli"
version = "1.5.3"
edition = "2021"
license = "MIT"
rust-version.workspace = true

[[bin]]
name = "ccvv"
path = "src/main.rs"

[dependencies]
ccvv-lib = { path = "../ccvv-lib" }
clap = { version = "4", features = ["derive"] }
similar = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
