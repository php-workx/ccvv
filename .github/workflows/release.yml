name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Parse version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ccvv $VERSION" \
              --generate-notes
          fi

  linux-build:
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Update version in Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' core/ccvv-lib/Cargo.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' core/ccvv-linux/Cargo.toml

      - name: Build ccvv-linux + ccvv CLI
        working-directory: core
        run: |
          cargo build --release --package ccvv-linux --bins --features tray --target ${{ matrix.target }}
          cargo build --release --package ccvv-cli --target ${{ matrix.target }}

      - name: Render Linux packaging metadata
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sed -e "s/@@VERSION@@/$VERSION/g" linux/PKGBUILD > linux/PKGBUILD.rendered
          sed -e "s/@@VERSION@@/$VERSION/g" linux/ccvv-linux.spec > linux/ccvv-linux.spec.rendered
          sed -e "s/@@VERSION@@/$VERSION/g" linux/ccvv-linux.control > linux/ccvv-linux.control.rendered

      - name: Package Linux tarball artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          DIST="ccvv-linux-${VERSION}-${TARGET}"
          mkdir -p "$DIST"
          cp "core/target/${TARGET}/release/ccvv-linux" "$DIST/"
          cp "core/target/${TARGET}/release/ccvv-tray-sni" "$DIST/"
          cp "core/target/${TARGET}/release/ccvv" "$DIST/"
          cp linux/ccvv-linux.desktop "$DIST/"
          cp linux/ccvv-linux.service "$DIST/"
          cp linux/Makefile "$DIST/"
          cp -R linux/icons "$DIST/icons"
          tar czf "${DIST}.tar.gz" "$DIST"

      - name: Build .deb package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          DEB_NAME="ccvv-linux_${VERSION}_amd64"
          DEB_ROOT="${DEB_NAME}"
          mkdir -p "${DEB_ROOT}/DEBIAN"
          mkdir -p "${DEB_ROOT}/usr/bin"
          mkdir -p "${DEB_ROOT}/etc/xdg/autostart"
          mkdir -p "${DEB_ROOT}/usr/lib/systemd/user"
          mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps"
          cp "core/target/${TARGET}/release/ccvv-linux" "${DEB_ROOT}/usr/bin/"
          cp "core/target/${TARGET}/release/ccvv-tray-sni" "${DEB_ROOT}/usr/bin/"
          cp "core/target/${TARGET}/release/ccvv" "${DEB_ROOT}/usr/bin/"
          cp linux/ccvv-linux.control.rendered "${DEB_ROOT}/DEBIAN/control"
          cp linux/ccvv-linux.desktop "${DEB_ROOT}/etc/xdg/autostart/"
          cp linux/ccvv-linux.service "${DEB_ROOT}/usr/lib/systemd/user/"
          cp linux/icons/*.svg "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps/"
          chmod 755 "${DEB_ROOT}/usr/bin/ccvv-linux" "${DEB_ROOT}/usr/bin/ccvv-tray-sni" "${DEB_ROOT}/usr/bin/ccvv"
          dpkg-deb --build "${DEB_ROOT}" "${DEB_NAME}.deb"

      - name: Lint .deb with lintian
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DEB_FILE="ccvv-linux_${VERSION}_amd64.deb"
          sudo apt-get install -y lintian
          lintian --suppress-tags dir-or-file-in-opt,non-standard-dir-perm "${DEB_FILE}"

      - name: Validate AUR PKGBUILD
        run: |
          set -euo pipefail
          bash -n linux/PKGBUILD.rendered
          grep -q 'pkgname=' linux/PKGBUILD.rendered
          grep -q 'pkgver=' linux/PKGBUILD.rendered
          grep -q 'pkgrel=' linux/PKGBUILD.rendered
          grep -q 'arch=' linux/PKGBUILD.rendered
          grep -q '^package()' linux/PKGBUILD.rendered
          echo "PKGBUILD syntax validation passed"

      - name: Package Linux metadata artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          META_DIR="ccvv-linux-${VERSION}-packaging"
          mkdir -p "$META_DIR"
          cp linux/PKGBUILD.rendered "$META_DIR/PKGBUILD"
          cp linux/ccvv-linux.spec.rendered "$META_DIR/ccvv-linux.spec"
          cp linux/ccvv-linux.control.rendered "$META_DIR/ccvv-linux.control"
          cp linux/ccvv-linux.desktop "$META_DIR/ccvv-linux.desktop"
          cp linux/ccvv-linux.service "$META_DIR/ccvv-linux.service"
          cp -R linux/icons "$META_DIR/icons"
          tar czf "${META_DIR}.tar.gz" "$META_DIR"

      - name: Upload Linux assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          TARBALL="ccvv-linux-${VERSION}-${TARGET}.tar.gz"
          DEB="ccvv-linux_${VERSION}_amd64.deb"
          META="ccvv-linux-${VERSION}-packaging.tar.gz"
          gh release view "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$TARBALL" "$DEB" "$META" --clobber

  rpm-build:
    needs: [create-release, linux-build]
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmlint gcc gh pkgconf-pkg-config wayland-devel libX11-devel libXfixes-devel dbus-devel

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Update version in Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' core/ccvv-lib/Cargo.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' core/ccvv-linux/Cargo.toml

      - name: Build ccvv-linux + ccvv CLI
        working-directory: core
        run: |
          cargo build --release --package ccvv-linux --bins --features tray --target x86_64-unknown-linux-gnu
          cargo build --release --package ccvv-cli --target x86_64-unknown-linux-gnu

      - name: Render RPM spec
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sed -e "s/@@VERSION@@/$VERSION/g" linux/ccvv-linux.spec > linux/ccvv-linux.spec.rendered

      - name: Build .rpm
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="x86_64-unknown-linux-gnu"
          DIST="ccvv-linux-${VERSION}-${TARGET}"
          mkdir -p "$DIST"
          cp "core/target/${TARGET}/release/ccvv-linux" "$DIST/"
          cp "core/target/${TARGET}/release/ccvv-tray-sni" "$DIST/"
          cp "core/target/${TARGET}/release/ccvv" "$DIST/"
          cp linux/ccvv-linux.desktop "$DIST/"
          cp linux/ccvv-linux.service "$DIST/"
          cp -R linux/icons "$DIST/icons"
          tar czf "${DIST}.tar.gz" "$DIST"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "${DIST}.tar.gz" ~/rpmbuild/SOURCES/
          cp linux/ccvv-linux.spec.rendered ~/rpmbuild/SPECS/ccvv-linux.spec
          rpmbuild -bb --define "_topdir ${HOME}/rpmbuild" ~/rpmbuild/SPECS/ccvv-linux.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm .
          echo "RPM built successfully"

      - name: Lint .rpm with rpmlint
        run: |
          rpmlint ./*.rpm

      - name: Upload RPM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" ./*.rpm --clobber

  release:
    needs: create-release
    runs-on: macos-15
    env:
      CCVV_MACOS_DEPLOYMENT_TARGET: '13.0'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Update version strings
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # mac/main.swift
          sed -i '' "s/let appVersion = \".*\"/let appVersion = \"$VERSION\"/" mac/main.swift

          # mac/Info.plist — CFBundleVersion and CFBundleShortVersionString
          sed -i '' "/<key>CFBundleVersion<\/key>/{ n; s/<string>.*<\/string>/<string>$VERSION<\/string>/; }" mac/Info.plist
          sed -i '' "/<key>CFBundleShortVersionString<\/key>/{ n; s/<string>.*<\/string>/<string>$VERSION<\/string>/; }" mac/Info.plist

          # core/ccvv-lib/Cargo.toml and core/ccvv-cli/Cargo.toml
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" core/ccvv-lib/Cargo.toml
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" core/ccvv-cli/Cargo.toml

          echo "Updated all version strings to $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Build, sign, and notarize
        working-directory: mac
        timeout-minutes: 30
        run: ./build.sh --notarize

      - name: Create ZIP artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent build/ccvv.app "ccvv-$VERSION.zip"

      - name: Compute SHA256
        id: sha
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(shasum -a 256 "ccvv-$VERSION.zip" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Upload macOS asset to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release view "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "ccvv-$VERSION.zip" --clobber

      - name: Verify release asset is downloadable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ASSET_URL="https://github.com/php-workx/ccvv/releases/download/v${VERSION}/ccvv-${VERSION}.zip"
          curl --head --fail --silent --show-error --location "$ASSET_URL" > /dev/null
          echo "Asset verified: $ASSET_URL"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/php-workx/homebrew-ccvv.git" \
            "$RUNNER_TEMP/homebrew-ccvv"

          mkdir -p "$RUNNER_TEMP/homebrew-ccvv/Casks"

          sed -e "s/@@VERSION@@/$VERSION/" -e "s/@@SHA256@@/$SHA/" \
            mac/ccvv.rb.template > "$RUNNER_TEMP/homebrew-ccvv/Casks/ccvv.rb"

          cd "$RUNNER_TEMP/homebrew-ccvv"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ccvv.rb

          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "Update ccvv to $VERSION"
            git push
          fi

      - name: Commit version bump back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG_SHA=$(git rev-parse "$GITHUB_REF_NAME")

          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($TAG_SHA) is not on main — skipping version bump"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main
          git pull origin main

          # Re-apply version changes to main
          sed -i '' "s/let appVersion = \".*\"/let appVersion = \"$VERSION\"/" mac/main.swift
          sed -i '' "/<key>CFBundleVersion<\/key>/{ n; s/<string>.*<\/string>/<string>$VERSION<\/string>/; }" mac/Info.plist
          sed -i '' "/<key>CFBundleShortVersionString<\/key>/{ n; s/<string>.*<\/string>/<string>$VERSION<\/string>/; }" mac/Info.plist
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" core/ccvv-lib/Cargo.toml
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" core/ccvv-cli/Cargo.toml

          git add mac/main.swift mac/Info.plist core/ccvv-lib/Cargo.toml core/ccvv-cli/Cargo.toml

          if git diff --cached --quiet; then
            echo "No version changes needed"
          else
            git commit -m "chore: bump version to $VERSION"
            git push origin main
          fi
