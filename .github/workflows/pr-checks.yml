name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Check formatting
        run: just format-check

  clippy:
    name: Rust Lint (Clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev
      - name: Run clippy
        run: just lint-check

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev
      - name: Run tests
        run: just test

  linux-daemon:
    name: Linux Daemon Feature Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux daemon dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev xvfb
      - name: Run Linux daemon tests with planned feature set
        working-directory: core
        run: cargo test -p ccvv-linux --features x11,wayland,tray,html-extract -- --nocapture

  linux-x11-integration:
    name: Linux X11 Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install X11 integration dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev xvfb
      - name: Run X11 integration tests under Xvfb
        working-directory: core
        run: xvfb-run -a cargo test -p ccvv-linux x11 -- --nocapture

  linux-sidecars:
    name: Linux Sidecar Builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev
      - name: Check SNI tray sidecar build
        working-directory: core
        run: cargo check -p ccvv-linux --features tray
      - name: Check legacy xembed sidecar build
        working-directory: core
        run: cargo check -p ccvv-linux --features xembed
      - name: Build Linux release binaries
        working-directory: core
        run: cargo build -p ccvv-linux --release --bins --features tray

  linux-gnome-limited:
    name: Linux GNOME Limited Mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev
      - name: Run GNOME limited-mode tests
        working-directory: core
        run: cargo test -p ccvv-linux gnome -- --nocapture

  # Linux stability gate: this headless wlroots run is required evidence before widening Linux rollout.
  linux-wayland-harness:
    name: Linux Stability Gate - Wayland Harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Wayland stability slice inside headless wlroots harness
        run: |
          linux/docker/wayland-harness/run.sh sh -lc '
            cd /workspace/core
            export CARGO_TARGET_DIR=/tmp/ccvv-target
            export CARGO_HOME=/tmp/ccvv-cargo-home
            cargo test --locked -p ccvv-linux wayland -- --nocapture
          '

  linux-packaging-assets:
    name: Linux Packaging Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop entry
        run: |
          grep -q '^Type=Application$' linux/ccvv-linux.desktop
          grep -q '^Exec=ccvv-linux$' linux/ccvv-linux.desktop
          grep -q '^X-GNOME-Autostart-enabled=true$' linux/ccvv-linux.desktop
          grep -q '^NoDisplay=true$' linux/ccvv-linux.desktop
      - name: Validate systemd user service defaults
        run: |
          grep -q '^ExecStart=%h/.local/bin/ccvv-linux --backend auto$' linux/ccvv-linux.service
          grep -q '^Restart=on-abnormal$' linux/ccvv-linux.service
      - name: Validate packaging metadata exists
        run: |
          test -f linux/PKGBUILD
          test -f linux/ccvv-linux.spec
          test -f linux/ccvv-linux.control
          grep -q '^pkgname=ccvv-linux$' linux/PKGBUILD
          grep -q '^Name: ccvv-linux$' linux/ccvv-linux.spec
          grep -q '^Package: ccvv-linux$' linux/ccvv-linux.control
          grep -q 'ccvv-tray-sni' linux/PKGBUILD
          grep -q 'ccvv-tray-sni' linux/ccvv-linux.spec
          grep -q 'ccvv-tray-sni' linux/ccvv-linux.control

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Run cargo deny
        working-directory: core
        run: cargo deny check bans advisories licenses sources

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install semgrep
        run: python -m pip install --upgrade pip semgrep
      - name: Run semgrep
        run: just semgrep

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: just shellcheck

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: just audit

  coverage:
    name: Coverage (LCOV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: |
            just
            cargo-llvm-cov
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libwayland-dev
      - name: Generate lcov
        run: just coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: core/target/coverage/lcov.info

  trufflehog:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
